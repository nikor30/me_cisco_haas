[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyciscome"
version = "0.1.0"
description = "Async client for Cisco Mobility Express controllers (SNMP, later SSH CLI)"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = ["asyncssh>=2.14", "pysnmp>=7.1"]

[project.optional-dependencies]
dev = ["pytest-homeassistant-custom-component", "ruff>=0.6"]

[tool.setuptools]
packages = ["pyciscome", "pyciscome.parsers"]

[tool.setuptools.package-dir]
pyciscome = "custom_components/cisco_me_plus/pyciscome"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"
src = [".", "tests", "tools"]

[tool.ruff.lint.isort]
known-first-party = ["pyciscome", "custom_components"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
